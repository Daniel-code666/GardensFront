<main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Registro inicial</h1>
        <p class="intro">Cree una cuenta para acceder al portal y administrar su huerta</p>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <label for="name">Nombre</label>
            <input id="name" type="text" formControlName="name" placeholder="Pepe Grillo" />

            <label for="email">Correo electrónico</label>
            <input id="email" type="email" formControlName="email" autocomplete="username"
                placeholder="admin@example.com" />

            <label for="password">Contraseña</label>
            <div class="password-field">
                <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
                    placeholder="Su contraseña" />
                <button class="visibility-button" type="button" (click)="showPassword.set(!showPassword())"
                    [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                    {{ showPassword() ? 'Ocultar' : 'Ver'}}
                </button>
            </div>
            @if (form.controls.password.touched && form.controls.password.invalid) {
            <small class="field-error">La contraseña es obligatoria.</small>
            }

            @if (error()) {
            <div class="alert alert-error" role="alert">{{ error() }}</div>
            }

            <button class="secondary-button login-button" type="submit" [disabled]="loading()">
                {{ loading() ? 'Creando usuario' : 'Crear usuario' }}
            </button>
        </form>

        <p class="local-note">
            <span></span> ¿Usuario registrado?
            <a routerLink="/auth/login">Inicie sesión aquí</a>
            <span></span>
        </p>
    </section>
</main>
