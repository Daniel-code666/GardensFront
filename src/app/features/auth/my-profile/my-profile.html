<div class="page-heading">
    <div>
        <h1>Mi perfil</h1>
        <p>Actualice sus datos personales</p>
    </div>
</div>

<section class="panel">
    <form [formGroup]="form" (ngSubmit)="updateUser()">
            <label for="name">Nombre</label>
            <input id="name" type="text" formControlName="name" placeholder="Pepe Grillo" />

            <label for="email">Correo electrónico</label>
            <input id="email" type="email" formControlName="email" autocomplete="username"
                placeholder="admin@example.com" />

            <label for="password">Contraseña</label>
            <div class="password-field">
                <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
                    placeholder="Su contraseña" />
                <button class="visibility-button" type="button" (click)="showPassword.set(!showPassword())"
                    [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                    {{ showPassword() ? 'Ocultar' : 'Ver'}}
                </button>
            </div>
            <div class="field wide">
                <label for="roleId">Rol</label>
                <p-select inputId="roleId" [options]="roles()" formControlName="roleId" 
                optionLabel="name" optionValue="id" placeholder="seleccione un rol" 
                (onChange)="onRoleChange($event.value)" styleClass="role-form-select" />
                @if (form.controls.roleId.touched && form.controls.roleId.invalid) {
                <small class="field-error">Seleccione un rol.</small>
                }
            </div>


            <button class="secondary-button login-button" type="submit" [disabled]="loading()">
                {{ loading() ? 'Actualiizando usuario' : 'Actualizar usuario' }}
            </button>
        </form>
</section>
